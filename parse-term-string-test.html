<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>parse-term-string test</title>
  <link rel="stylesheet" href="https://docling.net/book/docling/components/data-viewer/data-viewer.css">
  <link rel="icon" type="image/png" href="#">
  <style>

   body {
    display: grid;
    grid-template:
      "header header" auto 
      "input input" auto 
      "dataViewer pre" 1fr
    / 1fr 1fr;
   }
   h1 {grid-area: header;}
   input {grid-area: input;}
</style>
</head>
<body>
<h1>parse-term-string test</h1>
<input autocapitalize="off" spellcheck="false">
<data-viewer></data-viewer>
<pre></pre>

<script type="module">
import { parseTermString } from "./parse-term-string.js"
import {DataViewer} from 'https://docling.land/data-viewer/DataViewer.js'

addEventListener('keyup', e=> {
  if(e.target.matches('input')){
    let value = e.target.value
    let parsed = parseTermString(value)
    document.querySelector('data-viewer').data = parsed

    document.querySelector('pre').textContent = JSON.stringify(parsed, null, 2)

  }
})
</script>
</body>
</html>
